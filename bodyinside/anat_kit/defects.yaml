# anat_kit defect registry. One class per defect type ever flagged by a review. Every class MUST have an enforcement and (gate) a regression fixture that FAILS its check.
# Maintained by the rule in RUNBOOK.md "Defect registry". Wisdom reviews 1-21 are back-filled from defects_classes_draft.yaml after draft06.
- id: caption-claims-something-not-shown
  description: A caption/label states a change the picture does not show (curve change, disc pressing a nerve).
  sources: ["anat_neck/review/fable_review1.md P0-1, P0-2 (f315-465, f465-720)", "anat_wisdom/review/fable_review.md P0-1 (f30, f60, f89)", "fable_review3.md P0-2", "fable_review4.md P0-3, P1-5", "fable_review5.md P0-3", "fable_review6.md P0-3", "fable_review8.md P1-8", "fable_review9.md P1-7", "fable_review10.md P1-7", "fable_review11.md P1-8"]
  enforcement: {type: gate, check: caption_truth, fixture: caption-claims-something-not-shown, note: "each beat declares evidence (pose_delta / object_scale / anchors_visible) measured from pose_dump.json, scene_dump.json, label_pos.json"}
  recurrence:
    episodes:
    - anat_neck
    - anat_wisdom
    preflight: caption_truth
    template_fix: not due
- id: ear-shoulder-not-in-frame
  description: A caption about the ear/shoulder with neither in frame and no guide line.
  sources: ["anat_neck/review/fable_review1.md P0-4 (f885-989)"]
  enforcement: {type: gate, check: caption_truth, fixture: ear-shoulder-not-in-frame, note: "evidence type anchors_visible"}
- id: subject-too-small
  description: Declared subject covers too little of the band (neck < 150 px wide, black on both sides).
  sources: ["anat_neck/review/fable_review1.md P0-5 (f90-f520, f880-f989)"]
  enforcement: {type: gate, check: subject_size, fixture: subject-too-small, note: "alpha bbox area >= 0.40 and height >= 0.62 of the band, sampled every 15 frames"}
  recurrence:
    episodes:
    - anat_neck
    - anat_wisdom
    preflight: subject_size
    template_fix: not due
- id: rigid-bend-where-anatomy-bends-segmentally
  description: Posture moves as one rigid stick; the declared chain must share the rotation across joints.
  sources: ["anat_neck/review/fable_review1.md P0-3 (f150-f350)"]
  enforcement: {type: gate, check: rigid_bend, fixture: rigid-bend, note: "no joint carries > 45 % of the chain rotation on held poses (episode.json rigid_bend_check)"}
  recurrence:
    episodes:
    - anat_neck
    - anat_neck_v3
    - anat_wisdom
    preflight: rigid_bend
    template_fix: required
- id: interpenetration-jaw-through-neck
  description: One structure passes through another (mandible overlaps vertebrae).
  sources: ["anat_neck/review/fable_review1.md P0-3 (f300-f340)", "anat_wisdom reviews: roots/nerve/jaw interpenetration"]
  enforcement: {type: gate, check: penetration_gate, fixture: interpenetration-jaw-neck, note: "BVH overlap between episode.json no_overlap pairs on every 30th frame"}
  recurrence:
    episodes:
    - anat_neck
    - anat_wisdom
    preflight: penetration_gate
    template_fix: not due
- id: leader-lines-crossing
  description: Two callout leader lines cross so each label seems to point at the other structure.
  sources: ["anat_neck/review/fable_review1.md P0-2 (f600)"]
  enforcement: {type: gate, check: leaders_cross, fixture: leader-lines-crossing, note: "labels2d auto-lays callouts (left anchor -> left label, upper -> upper); checks.leaders_cross verifies per frame"}
- id: unreadable-small-text
  description: Overlay text too small for a phone.
  sources: ["anat_neck/review/fable_review1.md P2-16", "wisdom reviews (callout >= 48 px rule)", "anat_wisdom reviews (22-24 px grey text), see defects_classes_draft.yaml unreadable-small-text"]
  enforcement: {type: gate, check: text_size, fixture: unreadable-small-text, note: "callout/load/plumb >= 48 px, note >= 34 px"}
  recurrence:
    episodes:
    - anat_neck
    - anat_wisdom
    preflight: text_size
    template_fix: not due
- id: dead-time-no-event
  description: Seconds with no declared event and no large motion.
  sources: ["anat_neck/review/fable_review1.md P1-11 (f117-f150, f470-f520, f700-f726)", "anat_wisdom reviews (slow push-in with no event), see defects_classes_draft.yaml dead-time-no-event"]
  enforcement: {type: gate, check: dead_time, fixture: dead-time-no-event, note: "mean motion < 0.9 over 2 s with no label/beat boundary"}
  recurrence:
    episodes:
    - anat_neck
    - anat_neck_v3
    - anat_wisdom
    preflight: dead_time
    template_fix: required

