# studio-factory — unit tests of the imported production factory (studio/factory/tests).
#
# macOS because the factory targets it: review gates draw with the system Korean font
# (/System/Library/Fonts/AppleSDGothicNeo.ttc) and OCR through macOS Vision.
# Integration tests that need production media (studio/factory/tests_integration) do not run here.
name: studio-factory
on:
  pull_request:
  merge_group:
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: studio-factory-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}
jobs:
  unit:
    name: studio-factory unit
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: system tools
        run: |
          command -v ffmpeg || brew install ffmpeg
          ffmpeg -version | head -1
      # textgate.py loads the im-not-ai metrics (MIT) from studio/.deps/im-not-ai (IM_NOT_AI_DIR overrides); pinned commit.
      - name: im-not-ai metrics
        run: |
          d="studio/.deps/im-not-ai"
          git init -q "$d"
          git -C "$d" fetch -q --depth 1 https://github.com/epoko77-ai/im-not-ai bad4ef0a2b514318b2278b65cb4545414ad84d82
          git -C "$d" checkout -q FETCH_HEAD
      # The tests call studio/.venv/bin/python directly, as the factory does.
      - name: venv
        run: |
          python -m venv studio/.venv
          studio/.venv/bin/python -m pip install -q -r studio/factory/requirements-test.txt
      - name: Vision OCR helper
        run: swiftc -O studio/factory/ocr_vision.swift -o studio/factory/.ocr_vision
      - name: unit tests
        working-directory: studio/factory
        run: ../.venv/bin/python -m unittest discover -s tests -v
